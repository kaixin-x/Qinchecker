[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qinchecker"
version = "0.1.0"
description = "秦岭植物 FOC 核对工作台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "PySide6>=6.8,<7",
  "playwright>=1.62,<2",
  "psutil>=6,<8"
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
qinchecker = "qinchecker.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
